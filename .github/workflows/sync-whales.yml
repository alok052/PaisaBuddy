name: PaisaBuddy Live Whale Syncer (24/7 Free Cloud)

on:
  schedule:
    # India Equity Market Hours: Every 30 mins, 09:30 AM - 04:00 PM IST (04:00 - 10:30 UTC, Mon-Fri)
    - cron: '*/30 4-10 * * 1-5'
    # Post-Market NSE Bulk/Block Deals + Pre-US Open: 06:30 PM IST (13:00 UTC, Mon-Fri)
    - cron: '0 13 * * 1-5'
    # US NYSE/NASDAQ & SEC EDGAR Form 13F Polling: Hourly 14:00 - 21:00 UTC (7:30 PM - 2:30 AM IST, Mon-Fri)
    - cron: '0 14-21 * * 1-5'
    # Weekend Exchange Filing & FX Sync (Saturday & Sunday 5:30 PM IST)
    - cron: '0 12 * * 0,6'
  push:
    branches:
      - master
    paths:
      - 'scripts/sync_whales_data.py'
      - 'scripts/whales_registry.py'
      - '.github/workflows/sync-whales.yml'
  workflow_dispatch: # 1-click manual sync anytime from GitHub Actions tab

concurrency:
  group: sync-whales-live
  cancel-in-progress: true

jobs:
  sync:
    name: Sync 50 Whales + NSE + SEC 13F to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run 24/7 Whale Syncer Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://swnocdeyclhzevdgtdrz.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY || 'sb_publishable_r_NCnZLMgP24OLqNgdrnPg_MYzoskik' }}
        run: |
          python -u scripts/sync_whales_data.py
