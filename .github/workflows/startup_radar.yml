name: PaisaBuddy 24/7 Startup Radar

on:
  schedule:
    # Runs every 6 hours automatically (100% Free Cloud Automation)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub

jobs:
  scan-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install @supabase/supabase-js

      - name: Execute Auto Startup Radar
        run: node scripts/autoStartupRadar.js
